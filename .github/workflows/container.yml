name: Container image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/tolgabilgis/portfolio-site

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Test image
        run: |
          set -euo pipefail

          container_id=$(
            docker run \
              --detach \
              --publish 127.0.0.1:8080:8080 \
              "${IMAGE_NAME}:${GITHUB_SHA}"
          )

          trap 'docker rm --force "$container_id"' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/ |
            grep --fixed-strings '<title>Tolga Bilgis | Systems & Infrastructure</title>'

          curl --fail --silent --output /dev/null \
            http://127.0.0.1:8080/Tolga-Bilgis-Resume.pdf

          for asset in homelab.html resume.html styles.css resume.css script.js assets/homelab-rack.jpeg; do
            curl --fail --silent --output /dev/null \
              "http://127.0.0.1:8080/${asset}"
          done

          test "$(docker exec "$container_id" id -u)" != "0"

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish image
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Resolve published image digest
        if: github.event_name == 'push'
        id: image
        run: |
          set -euo pipefail

          digest=$(
            docker buildx imagetools inspect \
              "${IMAGE_NAME}:${GITHUB_SHA}" \
              --format '{{json .Manifest}}' |
              jq --raw-output '.digest'
          )

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected image digest: $digest" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check out homelab repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: TolgaBilgis/homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab

      - name: Update homelab image digest
        if: github.event_name == 'push'
        id: promotion
        working-directory: homelab
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          manifest=kubernetes/apps/portfolio-site.yml

          sed --in-place --regexp-extended \
            "s#(image: ${IMAGE_NAME}@)sha256:[a-f0-9]{64}#\1${IMAGE_DIGEST}#" \
            "$manifest"

          grep --fixed-strings \
            "image: ${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "$manifest"

          git diff --check

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push deployment branch
        if: >-
          github.event_name == 'push' &&
          steps.promotion.outputs.changed == 'true'
        working-directory: homelab
        env:
          DEPLOY_BRANCH: deploy/portfolio-${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$DEPLOY_BRANCH"
          git add kubernetes/apps/portfolio-site.yml
          git commit \
            --message "deploy: update portfolio image to ${GITHUB_SHA:0:12}"
          git push --set-upstream origin "$DEPLOY_BRANCH"

      - name: Open deployment pull request
        if: >-
          github.event_name == 'push' &&
          steps.promotion.outputs.changed == 'true'
        working-directory: homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_REPO_TOKEN }}
          DEPLOY_BRANCH: deploy/portfolio-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          printf \
            'Promotes portfolio commit %s.\n\nImage: %s@%s\n\nMerging this PR allows Argo CD to deploy the image.\n' \
            "$GITHUB_SHA" \
            "$IMAGE_NAME" \
            "$IMAGE_DIGEST" \
            > /tmp/portfolio-deployment-pr.md

          gh pr create \
            --repo TolgaBilgis/homelab \
            --base main \
            --head "$DEPLOY_BRANCH" \
            --title "deploy: update portfolio image" \
            --body-file /tmp/portfolio-deployment-pr.md

          gh pr merge \
            --repo TolgaBilgis/homelab \
            --auto \
            --squash \
            --delete-branch \
            "$DEPLOY_BRANCH"
