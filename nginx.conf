server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-addressed files are safe to cache across deployments.
    location ~ ^/assets/[^/]+\.[a-f0-9]{12}\.(css|js|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML and stable URLs must revalidate after a release.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
